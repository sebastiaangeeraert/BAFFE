function tsec(s){if(!s)return 0;const a=String(s).trim().split(':').map(Number);if(a.some(isNaN))return 0;return a.length==3?a[0]*3600+a[1]*60+a[2]:a.length==2?a[0]*60+a[1]:0}
function paceIt(pl,p){const T=[[5,p.t5],[10,p.t10],[21.1,p.t21]].map(x=>[x[0],tsec(x[1])]).filter(x=>x[1]>0);if(!T.length)return pl;const b=T.reduce((s,x)=>s+x[1]*Math.pow(10/x[0],1.06),0)/T.length/10,ag=p.age>=40?1.02:1,f=(a,c)=>fm(b*a)+' – '+fm(b*c)+' /km',e=f(1.22*ag,1.32*ag),L=f(1.28*ag,1.4*ag),q=f(1.03,1.08);pl.forEach(i=>{if(i.type=='long')i.pace=L;else if(i.type=='int'){i.pace=q;i.pe=e}else if(i.type=='run')i.pace=e});return pl}
function feas(p){const g=GOALS[p.goal];let r=p.age>=50?.07:p.age>=40?.08:.10;if(p.weight>=95)r=Math.min(r,.07);r=Math.max(.05,r-.01);const n=Math.ceil(Math.log(Math.max(1,g.peak/Math.max(p.weekly,8)))/Math.log(1+r)*1.35)+2;return p.weeks<n?'Voor '+g.n+' is ongeveer '+n+' weken opbouw verstandig vanaf '+p.weekly+' km per week. Met '+p.weeks+' weken bouwt het schema veilig op, maar je bereikt niet de volledige piek van '+g.peak+' km per week.':''}
function applyActs(acts){let n=0;acts.forEach(a=>{const i=S.plan.find(x=>x.date==a.d&&!x.done&&['run','int','long'].includes(x.type));if(i){i.done=true;i.actual=Math.round(a.k*10)/10;n++}});
 const w0=add(today,-7),pl=S.plan.filter(x=>x.date>=w0&&x.date<today&&['run','int','long'].includes(x.type)),key=monday(today);let msg='';
 if(pl.length&&S.adj!=key){const pk=pl.reduce((s,x)=>s+x.km,0),ak=pl.filter(x=>x.done).reduce((s,x)=>s+(x.actual||x.km),0),ra=pk?ak/pk:1;let f=1;if(ra<.7)f=.9;else if(ra>1.2)f=.95;const lr=pl.filter(x=>x.rate).slice(-2);if(lr.length==2&&lr.every(x=>x.rate<=2))f*=.9;if(f<1){S.plan.filter(x=>x.date>=today&&!x.done&&x.km).forEach(x=>x.km=r5(x.km*f));msg='Schema '+Math.round((1-f)*100)+'% lichter gemaakt (vorige week '+Math.round(ra*100)+'% van het plan gelopen).'}S.adj=key}
 S.msg=(n?n+' training(en) automatisch afgevinkt. ':'')+msg;save();return n}

function sleepF(){const k=Object.keys(S.sleep).sort().slice(-3);if(!k.length)return{f:1,a:null};const a=k.reduce((s,x)=>s+S.sleep[x],0)/k.length;return{f:a<6?.7:a<7?.85:1,a}}
function eff(it){const sl=sleepF();const adj=sl.f<1&&!it.done&&['run','int','long'].includes(it.type)&&it.date>=today&&it.date<=add(today,2);
 return adj?{...it,km:r5(it.km*sl.f),type:it.type=='int'?'run':it.type,pace:it.type=='int'?it.pe:it.pace,adj:1,desc:it.type=='int'?'Slecht geslapen: intervallen vervangen door een rustige duurloop (RPE 3-4).':it.desc}:it}

function gen(p){
 const g=GOALS[p.goal],n=RUND[p.days].length,rd=RUND[p.days];
 let r=p.age>=50?.07:p.age>=40?.08:.10;if(p.weight>=95)r=Math.min(r,.07);r=Math.max(.05,r-.01);
 const kd=[0,1,2,3,4,5,6].filter(x=>!rd.includes(x)).slice(0,2),mon=monday(p.start||today),plan=[];
 let build=Math.max(p.weekly,8),id=0;
 for(let w=0;w<p.weeks;w++){
  const last=w==p.weeks-1,dl=w%(p.age>=50?3:4)==(p.age>=50?2:3)&&!last;let wk;
  if(last)wk=build*.6;else if(dl)wk=build*.75;else{build=Math.min(g.peak,build*(1+r));wk=build}
  let lr=Math.min(g.long,Math.max(3,p.long)+w*.7,wk*.4);if(dl)lr*=.8;if(last)lr*=.7;
  const er=(wk-lr)/(n-1),reps=Math.min(4+Math.floor((w-2)/2),8);
  const wr=p.weight>=95?' Wissel eventueel 8 min joggen en 1 min wandelen.':'';
  for(let day=0;day<7;day++){
   const date=add(mon,w*7+day);if(date<(p.start||today))continue;
   const ri=rd.indexOf(day),b={id:id++,date,done:false,skipped:false};
   if(ri==n-1)plan.push({...b,type:'long',km:r5(lr),title:'Lange rustige duurloop',desc:'Heel rustig tempo (RPE 3). Vlak en zacht terrein. Stop bij pijn aan de achillespees.'+wr});
   else if(ri==1&&n>=3&&w>=2&&!dl&&!last)plan.push({...b,type:'int',km:r5(er),title:'Zachte intervallen',desc:'Warm-up 10 min rustig. '+reps+'× 1 min vlot (RPE 6/10, géén sprint) met 2 min wandelen of joggen ertussen. Cooldown 10 min. Vlak, niet bergop.'});
   else if(ri>=0)plan.push({...b,type:'run',km:r5(er),title:'Rustige duurloop',desc:'Je kan nog een gesprek voeren (RPE 3-4).'+(ri==1&&w>=1&&!dl&&!last?' Eindig met 4 versnellingen van 20 sec (RPE 5, geen sprint).':'')+wr});
   else if(kd.includes(day)){const k=kd.indexOf(day)?'B':'A';plan.push({...b,type:'str',km:0,title:'Kracht en achilles ('+k+')',desc:'ex:'+k})}
   else plan.push({...b,type:'rest',km:0,title:'Rustdag',desc:'Wandelen of rustig fietsen mag. Laat kuiten en achillespezen herstellen.'});
  }}
 return plan}

function shift(from,n){S.plan.forEach(i=>{if(!i.done&&i.date>=from)i.date=add(i.date,n)});save()}
function mark(id,v){const i=S.plan.find(x=>x.id==id);i.done=v;save();r()}
function moveOne(id){ask=id;r()}
function doShift(all){const i=S.plan.find(x=>x.id==ask);if(all)shift(i.date,1);else{const t=add(i.date,1),rs=S.plan.find(x=>x.date==t&&x.type=='rest');if(rs)rs.date=i.date;i.date=t}ask=null;save();r()}

function imp(el){const fs=[...el.files];if(!fs.length)return;const acts=[];let n=0;const fin=()=>{if(++n<fs.length)return;const from=add(today,-28),a=acts.filter(x=>x.d>=from);let tot=0,mx=0;a.forEach(x=>{tot+=x.k;mx=Math.max(mx,x.k)});if(S.plan.length&&acts.length)applyActs(acts);if(a.length){$('#pk').value=Math.round(tot/4);$('#pl').value=Math.round(mx)}$('#cr').textContent=a.length?'Gevonden: '+Math.round(tot/4)+' km/week en langste loop '+mx.toFixed(1)+' km ('+a.length+' activiteiten in de laatste 4 weken).':'Geen recente loopgegevens herkend.'};fs.forEach(f=>{const fr=new FileReader(),nm=f.name.toLowerCase();fr.onload=()=>{try{const t=fr.result;if(nm.endsWith('.gpx')){const g=gpx(t);if(g)acts.push(g)}else if(nm.endsWith('.tcx')){const g=tcx(t);if(g)acts.push(g)}else cs(t,acts)}catch(e){}fin()};fr.onerror=fin;fr.readAsText(f)})}
function r(){
 if(!S.p)tab='p';
 $('#v').innerHTML=(tab=='v'?vTab():tab=='k'?kTab():tab=='s'?sTab():pTab())+sheet()+dsheet();
 $('#nv').innerHTML=[['v','🏠','Vandaag'],['k','📅','Kalender'],['s','😴','Slaap'],['p','⚙️','Profiel']].map(x=>'<button class="'+(tab==x[0]?'on':'')+'" onclick="tab=\''+x[0]+'\';r()">'+NI[x[0]]+x[2]+'</button>').join('')}
if(S.last!=today){S.last=today;S.inbox.push({d:today,t:pick(TEASE)});S.inbox=S.inbox.slice(-20);save()}ap();setTimeout(()=>{if(S.sv&&S.sv.rt&&S.p)sv('s').then(()=>{if(tab=='v')r()})},800);
r();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
