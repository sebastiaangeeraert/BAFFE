function paceIt(pl,p){const T=[[5,p.t5],[10,p.t10],[21.1,p.t21]].map(x=>[x[0],tsec(x[1])]).filter(x=>x[1]>0);const cb=+p.cd>0&&tsec(p.ct)>0?tsec(p.ct)/(+p.cd)/1.27:0;if(!T.length&&!cb)return pl;const b=T.length?T.reduce((s,x)=>s+x[1]*Math.pow(10/x[0],1.06),0)/T.length/10:cb,ag=p.age>=40?1.02:1,f=(a,c)=>fm(b*a)+' – '+fm(b*c)+' /km',e=f(1.22*ag,1.32*ag),L=f(1.28*ag,1.4*ag),q=f(1.03,1.08);pl.forEach(i=>{if(i.type=='long')i.pace=L;else if(i.type=='int'){i.pace=q;i.pe=e}else if(i.type=='run')i.pace=e});return pl}
function feas(p){const g=GOALS[p.goal];let r=p.age>=50?.07:p.age>=40?.08:.10;if(p.weight>=95)r=Math.min(r,.07);r=Math.max(.05,r-.01);const n=Math.ceil(Math.log(Math.max(1,g.peak/Math.max(p.weekly,8)))/Math.log(1+r)*1.35)+2;return p.weeks<n?'Voor '+g.n+' is ongeveer '+n+' weken opbouw verstandig vanaf '+p.weekly+' km per week. Met '+p.weeks+' weken bouwt het schema veilig op, maar je bereikt niet de volledige piek van '+g.peak+' km per week.':''}
function applyActs(acts){let n=0;acts.forEach(a=>{const i=S.plan.find(x=>x.date==a.d&&!x.done&&['run','int','long'].includes(x.type));if(i){i.done=true;i.actual=Math.round(a.k*10)/10;n++}});
 const w0=add(today,-7),pl=S.plan.filter(x=>x.date>=w0&&x.date<today&&['run','int','long'].includes(x.type)),key=monday(today);let msg='';
 if(pl.length&&S.adj!=key){const pk=pl.reduce((s,x)=>s+x.km,0),ak=pl.filter(x=>x.done).reduce((s,x)=>s+(x.actual||x.km),0),ra=pk?ak/pk:1;let f=1;if(ra<.7)f=.9;else if(ra>1.2)f=.95;const lr=pl.filter(x=>x.rate).slice(-2);if(lr.length==2&&lr.every(x=>x.rate<=2))f*=.9;if(f<1){S.plan.filter(x=>x.date>=today&&!x.done&&x.km).forEach(x=>x.km=r5(x.km*f));msg='Schema '+Math.round((1-f)*100)+'% lichter gemaakt (vorige week '+Math.round(ra*100)+'% van het plan gelopen).'}S.adj=key}

function eff(it){const sl=sleepF();const adj=sl.f<1&&!it.done&&['run','int','long'].includes(it.type)&&it.date>=today&&it.date<=add(today,2);
 return adj?{...it,km:r5(it.km*sl.f),type:it.type=='int'?'run':it.type,pace:it.type=='int'?it.pe:it.pace,adj:1,desc:it.type=='int'?'Slecht geslapen: intervallen vervangen door een rustige duurloop (RPE 3-4).':it.desc}:it}

function gen(p){
 const g=GOALS[p.goal],n=RUND[p.days].length,rd=RUND[p.days];
 let r=p.age>=50?.07:p.age>=40?.08:.10;if(p.weight>=95)r=Math.min(r,.07);r=Math.max(.05,r-.01);
 const kd=[0,1,2,3,4,5,6].filter(x=>!rd.includes(x)).slice(0,2),mon=monday(p.start||today),plan=[];
 let build=Math.max(p.weekly,8),id=0;
 for(let w=0;w<p.weeks;w++){
  const last=w==p.weeks-1,dl=w%(p.age>=50?3:4)==(p.age>=50?2:3)&&!last;let wk;
  if(last)wk=build*.6;else if(dl)wk=build*.75;else{build=Math.min(g.peak,w?build*(1+r):build);wk=build}
  let lr=Math.min(Math.max(g.long,p.long),Math.max(3,p.long,+p.cd||0)+w*.7,Math.min(wk*.55,Math.max(wk*.4,p.long)));if(dl)lr*=.8;if(last)lr*=.7;
  const er=(wk-lr)/(n-1),reps=Math.min(4+Math.floor((w-2)/2),8);
  const wr=p.weight>=95?' Wissel eventueel 8 min joggen en 1 min wandelen.':'';
  for(let day=0;day<7;day++){
   const date=add(mon,w*7+day);if(date<(p.start||today))continue;
   const ri=rd.indexOf(day),b={id:id++,date,done:false,skipped:false};
   if(ri==n-1)plan.push({...b,type:'long',km:r5(lr),title:'Lange rustige duurloop',desc:'Heel rustig tempo (RPE 3). Vlak en zacht terrein. Stop bij pijn aan de achillespees.'+wr});
   else if(ri==1&&n>=3&&w>=2&&!dl&&!last)plan.push({...b,type:'int',km:r5(er),title:'Zachte intervallen',desc:'Warm-up 10 min rustig. '+reps+'× 1 min vlot (RPE 6/10, géén sprint) met 2 min wandelen of joggen ertussen. Cooldown 10 min. Vlak, niet bergop.'});
   else if(ri>=0)plan.push({...b,type:'run',km:r5(er),title:'Rustige duurloop',desc:'Je kan nog een gesprek voeren (RPE 3-4).'+(ri==1&&w>=1&&!dl&&!last?' Eindig met 4 versnellingen van 20 sec (RPE 5, geen sprint).':'')+wr});
   else if(kd.includes(day)){const k=kd.indexOf(day)?'B':'A';plan.push({...b,type:'str',km:0,title:'Kracht en achilles ('+k+')',desc:'ex:'+k})}
   else plan.push({...b,type:'rest',km:0,title:'Rustdag',desc:'Wandelen of rustig fietsen mag. Laat kuiten en achillespezen herstellen.'});
  }}
 return plan}

function gpx(t){const x=new DOMParser().parseFromString(t,'text/xml'),p=[...x.getElementsByTagName('trkpt')],ty=x.getElementsByTagName('type')[0];if(p.length<2||(ty&&!/run|hardl|trail|^9$/i.test(ty.textContent)))return null;let k=0;for(let i=1;i<p.length;i++)k+=hav(+p[i-1].getAttribute('lat'),+p[i-1].getAttribute('lon'),+p[i].getAttribute('lat'),+p[i].getAttribute('lon'));const tm=p.map(e=>{const n=e.getElementsByTagName('time')[0];return n?new Date(n.textContent):NaN}).filter(d=>!isNaN(d));if(!tm.length)return null;return{d:iso(tm[0]),k,s:Math.max(0,(tm[tm.length-1]-tm[0])/1000)}}

function cs(t,acts){const L=t.split(/\r?\n/).filter(Boolean),s=L[0].includes(';')?';':',',H=sp2(L[0],s).map(x=>x.toLowerCase().trim()),di=H.findIndex(x=>/date|datum/.test(x)),ki=H.findIndex(x=>/distance|afstand/.test(x)),ti=H.findIndex(x=>/type|soort/.test(x)),ci=H.findIndex(x=>/^(time|duration|duur|moving time|elapsed time|tijd|bewegingstijd)/.test(x));if(di<0||ki<0)return;
 L.slice(1).forEach(l=>{const c=sp2(l,s),d=new Date(c[di]);if(isNaN(d))return;if(ti>=0&&c[ti]&&!/run|loop|hardl/i.test(c[ti]))return;let k=parseFloat(String(c[ki]).replace(',','.'));if(!(k>0))return;if(k>200)k/=1000;let q=0;if(ci>=0){const v=String(c[ci]||'');q=v.includes(':')?tsec(v):parseFloat(v.replace(',','.'))||0}acts.push({d:iso(d),k,s:q})})}
function imp(el){const fs=[...el.files];if(!fs.length)return;const acts=[];let n=0,fit=0;const fin=()=>{if(++n<fs.length)return;if(!acts.length&&fit){S.impMsg='FIT-bestanden worden niet gelezen. Exporteer in Coros als GPX, TCX of CSV.';save();r()}else analyse(acts)};
 fs.forEach(f=>{const fr=new FileReader(),nm=f.name.toLowerCase();if(nm.endsWith('.fit')){fit=1;fin();return}fr.onload=()=>{try{const t=fr.result;if(nm.endsWith('.gpx')){const g=gpx(t);if(g)acts.push(g)}else if(nm.endsWith('.tcx')){const g=tcx(t);if(g)acts.push(g)}else cs(t,acts)}catch(e){}fin()};fr.onerror=fin;fr.readAsText(f)})}
function analyse(A){sp();const a=A.filter(x=>x.k>.5);if(!a.length){S.impMsg='Geen loopgegevens herkend. Gebruik GPX, TCX of CSV.';save();r();return}
 const end=a.reduce((m,x)=>x.d>m?x.d:m,a[0].d),rec=a.filter(x=>x.d>=add(end,-27)),p=S.p,wk=Math.max(1,Math.min(4,(diff(end,rec.reduce((m,x)=>x.d<m?x.d:m,end))+1)/7));
 p.weekly=Math.round(rec.reduce((s,x)=>s+x.k,0)/wk);p.long=Math.round(Math.max(...rec.map(x=>x.k)));
 const best=D=>{let m=0;a.forEach(x=>{if(x.s>0&&x.k>=D*.97&&x.k<=D*1.15){const e=x.s*Math.pow(D/x.k,1.06);if(!m||e<m)m=e}});return m?fT(m):''},t5=best(5),t10=best(10),t21=best(21.0975);if(t5)p.t5=t5;if(t10)p.t10=t10;if(t21)p.t21=t21;
 const rt=rec.filter(x=>x.s>0).sort((u,v)=>u.d<v.d?1:-1).slice(0,5);if(rt.length){const dd=rt.map(x=>x.k).sort((u,v)=>u-v),med=dd[Math.floor(dd.length/2)],pc=rt.map(x=>x.s/x.k).sort((u,v)=>u-v)[Math.floor(rt.length/2)];p.cd=String(Math.round(med*10)/10);p.ct=fT(pc*med)}

 S.impMsg=a.length+' loopjes ingelezen: '+p.weekly+' km per week, langste loop '+p.long+' km'+(t5||t10||t21?'. Tijden zijn geschat uit je trainingen en eerder voorzichtig'+(t5?'':'')+'':'')+'. Controleer de waarden en tik op Maak schema op maat.';save();r()}
function dash(){const p=S.p;if(!S.plan.length||!p)return'';const ds=S.plan.map(x=>x.date).sort(),st=monday(ds[0]),n=Math.max(1,Math.ceil((diff(ds[ds.length-1],st)+1)/7)),cw=Math.min(n,Math.max(1,Math.floor(diff(today,st)/7)+1)),A=[];

 const mx=Math.max(1,...A.map(x=>Math.max(x.pl,x.dn))),W=320,H=90,bw=W/n,cur=A[cw-1],bars=A.map((x,i)=>{const y1=H-x.pl/mx*H,y2=H-x.dn/mx*H,px=i*bw+1,w=Math.max(1,bw-2);return `<rect x="${px}" y="${y1}" width="${w}" height="${H-y1}" rx="2" fill="currentColor" opacity="${i==cw-1?.4:.15}"/><rect x="${px}" y="${y2}" width="${w}" height="${H-y2}" rx="2" fill="url(#gg)"/>`}).join('');

function sleepAn(){const K=Object.keys(S.sleep).sort(),V=K.map(x=>S.sleep[x]);if(V.length<3)return'<div class="c"><h3>Analyse</h3><div class="mu">Voer minstens 3 nachten in voor een analyse.</div></div>';
 const av=a=>a.reduce((s,x)=>s+x,0)/a.length,l7=V.slice(-7),p7=V.slice(-14,-7),a7=av(l7),sd=Math.sqrt(av(l7.map(x=>(x-a7)**2)))*60,deb=l7.reduce((s,x)=>s+Math.max(0,7.5-x),0),lo=V.indexOf(Math.min(...V)),hi=V.indexOf(Math.max(...V)),n6=l7.filter(x=>x<6).length,n7=l7.filter(x=>x>=7).length,tr=p7.length>=3?(a7-av(p7))*60:null,reg=sd<45?'regelmatig':sd<90?'redelijk regelmatig':'erg wisselend',

function phase(it){const p=S.p||PD,w=Math.max(1,Math.floor(diff(it.date,monday(p.start||today))/7)+1),n=p.weeks;return 'Week '+w+' van '+n+': '+(w>=n?'afbouwweek. Je loopt minder zodat je fris aan je doel begint.':w<=n/3?'opbouwfase. Je lichaam en je pezen wennen aan de belasting.':w<=2*n/3?'verdiepingsfase. Het volume en de lange loop groeien voorzichtig.':'piekfase. Je zit op je hoogste belasting, bewaak je herstel en je slaap.')}
function build(it){if(it.type=='rest')return'';const C={w:'#8b95b0',e:'#12b76a',h:'#ff9f1c',k:'#7c5cff'},m5=(it.pace||'').match(/(\d+):(\d+)\s*–\s*(\d+):(\d+)/),pm=m5?((+m5[1]*60+ +m5[2])+(+m5[3]*60+ +m5[4]))/120:6.5;let g=[],tx='';

 const T=g.reduce((s,x)=>s+x[1],0),W=320,st=T>90?20:T>45?10:5;let x0=0,rc='',tk='';g.forEach(x=>{const w=x[1]/T*W;rc+=`<rect x="${x0+.5}" y="4" width="${Math.max(1,w-1)}" height="26" rx="4" fill="${C[x[0]]}"/>`;x0+=w});
