function fig2(t,w){w=w||96;const P=(d,o)=>'<path d="'+d+'"'+(o?' opacity=".45"':'')+'/>',

 if(/romanian|deadlift/i.test(t))return W('<circle r="5.5"><animate attributeName="cx" values="50;78;50" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="cy" values="10;30;10" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>'+A('M50 36L50 18','M50 36L72 34',0,2.4)+P('M50 36L50 62')+A('M50 36L53 60','M50 36L22 34',1,2.4)+A('M50 20L50 36','M72 34L72 52',0,2.4)+A('M52 20L52 36','M75 34L75 52',1,2.4));
 if(/kuit|tibialis/i.test(t))return W(G(C(50,12)+P('M50 18L50 40')+P('M50 40L45 62')+P('M50 40L55 62')+P('M50 22L40 32L40 42')+P('M50 22L60 32L60 42')+P('M41 62H48M52 62H59'),'translate','0 0;0 -5;0 0')+'<rect x="34" y="63" width="32" height="3" rx="1.5" fill="currentColor" opacity=".35" stroke="none"/>');
 return W(G(C(50,12)+P('M50 18L50 40')+P('M50 40L50 62')+P('M50 40L63 48L63 60')+P('M50 22L34 28')+P('M50 22L66 28'),'rotate','-4 50 62;4 50 62;-4 50 62'));}
const fm=s=>{s=Math.round(s);return Math.floor(s/60)+':'+pad(s%60)};
function tsec(s){if(!s)return 0;const a=String(s).trim().split(':').map(Number);if(a.some(isNaN))return 0;return a.length==3?a[0]*3600+a[1]*60+a[2]:a.length==2?a[0]*60+a[1]:0}
function paceIt(pl,p){const T=[[5,p.t5],[10,p.t10],[21.1,p.t21]].map(x=>[x[0],tsec(x[1])]).filter(x=>x[1]>0);const cb=+p.cd>0&&tsec(p.ct)>0?tsec(p.ct)/(+p.cd)/1.27:0;if(!T.length&&!cb)return pl;const b=T.length?T.reduce((s,x)=>s+x[1]*Math.pow(10/x[0],1.06),0)/T.length/10:cb,ag=p.age>=40?1.02:1,f=(a,c)=>fm(b*a)+' – '+fm(b*c)+' /km',e=f(1.22*ag,1.32*ag),L=f(1.28*ag,1.4*ag),q=f(1.03,1.08);pl.forEach(i=>{if(i.type=='long')i.pace=L;else if(i.type=='int'){i.pace=q;i.pe=e}else if(i.type=='run')i.pace=e});return pl}

function applyActs(acts){let n=0;acts.forEach(a=>{const i=S.plan.find(x=>x.date==a.d&&!x.done&&['run','int','long'].includes(x.type));if(i){i.done=true;i.actual=Math.round(a.k*10)/10;n++}});
 const w0=add(today,-7),pl=S.plan.filter(x=>x.date>=w0&&x.date<today&&['run','int','long'].includes(x.type)),key=monday(today);let msg='';
 if(pl.length&&S.adj!=key){const pk=pl.reduce((s,x)=>s+x.km,0),ak=pl.filter(x=>x.done).reduce((s,x)=>s+(x.actual||x.km),0),ra=pk?ak/pk:1;let f=1;if(ra<.7)f=.9;else if(ra>1.2)f=.95;const lr=pl.filter(x=>x.rate).slice(-2);if(lr.length==2&&lr.every(x=>x.rate<=2))f*=.9;if(f<1){S.plan.filter(x=>x.date>=today&&!x.done&&x.km).forEach(x=>x.km=r5(x.km*f));msg='Schema '+Math.round((1-f)*100)+'% lichter gemaakt (vorige week '+Math.round(ra*100)+'% van het plan gelopen).'}S.adj=key}

function gen(p){
 const g=GOALS[p.goal],n=RUND[p.days].length,rd=RUND[p.days];
 let r=p.age>=50?.07:p.age>=40?.08:.10;if(p.weight>=95)r=Math.min(r,.07);r=Math.max(.05,r-.01);
 const kd=[0,1,2,3,4,5,6].filter(x=>!rd.includes(x)).slice(0,2),mon=monday(p.start||today),plan=[];
 let build=Math.max(p.weekly,8),id=0;
 for(let w=0;w<p.weeks;w++){
  const last=w==p.weeks-1,dl=w%(p.age>=50?3:4)==(p.age>=50?2:3)&&!last;let wk;
  if(last)wk=build*.6;else if(dl)wk=build*.75;else{build=Math.min(g.peak,w?build*(1+r):build);wk=build}
  let lr=Math.min(Math.max(g.long,p.long),Math.max(3,p.long,+p.cd||0)+w*.7,Math.min(wk*.55,Math.max(wk*.4,p.long)));if(dl)lr*=.8;if(last)lr*=.7;
  const er=(wk-lr)/(n-1),reps=Math.min(4+Math.floor((w-2)/2),8);
  const wr=p.weight>=95?' Wissel eventueel 8 min joggen en 1 min wandelen.':'';
  for(let day=0;day<7;day++){
   const date=add(mon,w*7+day);if(date<(p.start||today))continue;
   const ri=rd.indexOf(day),b={id:id++,date,done:false,skipped:false};
   if(ri==n-1)plan.push({...b,type:'long',km:r5(lr),title:'Lange rustige duurloop',desc:'Heel rustig tempo (RPE 3). Vlak en zacht terrein. Stop bij pijn aan de achillespees.'+wr});
   else if(ri==1&&n>=3&&w>=2&&!dl&&!last)plan.push({...b,type:'int',km:r5(er),title:'Zachte intervallen',desc:'Warm-up 10 min rustig. '+reps+'× 1 min vlot (RPE 6/10, géén sprint) met 2 min wandelen of joggen ertussen. Cooldown 10 min. Vlak, niet bergop.'});
   else if(ri>=0)plan.push({...b,type:'run',km:r5(er),title:'Rustige duurloop',desc:'Je kan nog een gesprek voeren (RPE 3-4).'+(ri==1&&w>=1&&!dl&&!last?' Eindig met 4 versnellingen van 20 sec (RPE 5, geen sprint).':'')+wr});
   else if(kd.includes(day)){const k=kd.indexOf(day)?'B':'A';plan.push({...b,type:'str',km:0,title:'Kracht en achilles ('+k+')',desc:'ex:'+k})}
   else plan.push({...b,type:'rest',km:0,title:'Rustdag',desc:'Wandelen of rustig fietsen mag. Laat kuiten en achillespezen herstellen.'});
  }}
 return plan}

function muZones(){const z=MU().z;return `<div class="mu" style="margin:6px 0 10px">Richttempo's, geen verplichte snelheden. Hartslag, omstandigheden en vermoeidheid wegen zwaarder.</div><div class="c">${Object.keys(MUZ0).map(k=>`<div class="g2"><div><label>${MUZN[k]} van</label><input id="zv_${k}" value="${z[k][0]}"></div><div><label>tot (/km)</label><input id="zt_${k}" value="${z[k][1]}"></div></div>`).join('')}<button class="b" onclick="muZs()">Bewaar tempo's</button><button class="b g" onclick="MU().z=JSON.parse(JSON.stringify(MUZ0));save();r()">Standaard</button></div>`}
function muZs(){const z=MU().z;Object.keys(MUZ0).forEach(k=>{const a=$('#zv_'+k).value.trim(),b=$('#zt_'+k).value.trim();if(/^\d:\d\d$/.test(a)&&/^\d:\d\d$/.test(b))z[k]=[a,b]});save();r()}
function muKr(){const m=MU(),wk=m.plan.filter(s=>s.ks&&s.date>=monday(today)&&s.date<add(monday(today),7));return `<div class="mu" style="margin:6px 0 10px">Twee korte krachtmomenten per week (${MW[muCfg().s[0]]} en ${MW[muCfg().s[1]]}). Optioneel te registreren. Pijn in de pees boven 3 op 10: stop of verminder.</div>${wk.map(muCard).join('')}<div class="c"><h3>Oefeningen</h3>${MUEX.map(e=>`<div class="bd"><b>${e[0]}</b><div>${(m.plan.find(s=>s.ks)||{sets:2}).sets} sets · ${e[1][0]} · ${e[1][1]}</div><div class="mu">${e[2]}</div><div class="mu">Spieren en functie: ${e[3]}</div></div>`).join('')}</div>`}
function muVo(){const m=MU(),I2=(id,l,t)=>`<label>${l}</label><input id="${id}" ${t||''}>`;return `<div class="c"><h3>Marathon</h3><div>Oefen koolhydraten tijdens lange duurlopen. Bouw geleidelijk op richting 60-90 g koolhydraten per uur als je het goed verdraagt, en oefen je drinkstrategie.</div></div><div class="c"><h3>100 km</h3><div>Test voeding tijdens 3/1-trainingen: gels, sportdrank en vaste voeding. Volg je maag- en darmtolerantie op en evalueer je drinkstrategie.</div></div><div class="c"><h3>Voedingslogboek</h3><div class="g2"><div>${I2('nc','Koolhydraten (g/u)','type="number"')}</div><div>${I2('nd','Drank (ml/u)','type="number"')}</div></div>${I2('nt','Wat at en dronk je (gel, sportdrank, vast)')}<label>Maag- en darmtolerantie (1 slecht, 5 goed)</label><select id="ng"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><button class="b" onclick="muNl()">Bewaar</button>${m.nl.slice(-8).reverse().map(x=>`<div class="bd"><b>${x.d}</b> · ${x.c||'–'} g/u · ${x.w||'–'} ml/u · tolerantie ${x.g}/5<div class="mu">${esc(x.t)}</div></div>`).join('')}</div>`}
function muNl(){MU().nl.push({d:today,c:+$('#nc').value||0,w:+$('#nd').value||0,t:$('#nt').value,g:+$('#ng').value});save();r()}
function muTab(){const m=MU(),S5=[['d','Overzicht'],['k','Kalender'],['z','Zones'],['c','Kracht'],['v','Voeding'],['i','Instellen']];return `<h2>Marathon + Ultra Challenge</h2><div class="seg" style="flex-wrap:wrap">${S5.map(x=>`<button class="${mut==x[0]?'on':''}" style="font-size:11.5px;flex:1 0 30%" onclick="mut='${x[0]}';r()">${x[1]}</button>`).join('')}</div>`+(mut=='d'?muDash():mut=='k'?muCal():mut=='z'?muZones():mut=='c'?muKr():mut=='i'?muInst():muVo())}
function muAct(id,k,v){const m=MU(),s=m.plan.find(x=>x.id==id);if(!s)return;if(k=='done'){s.done=true;s.skipped=false;s.rest=false;s.actual=s.actual||s.km}if(k=='skip'){s.skipped=true;s.done=false;s.rest=false}if(k=='rest'){s.rest=true;s.done=false;s.skipped=false}if(k=='undo'){s.done=s.skipped=s.rest=false;delete s.link;delete s.actual}if(k=='pick')m.pick[id]=v?'alt':null;if(k=='km'){const n=parseFloat(String(prompt('Nieuwe afstand in km',s.km)||'').replace(',','.'));if(n>=0&&n<=120){s.km=n;s.edited=true}}save();r()}
function muCand(s){const used=Object.values(MU().plan).map(x=>x.link).filter(Boolean);return(S.ivA||[]).filter(a=>a.d==s.date&&Math.abs(a.k-s.km)<=Math.max(1,s.km*.2)&&!used.includes(a.d+'|'+a.k.toFixed(2)))}
function muLink(id,i){const s=MU().plan.find(x=>x.id==id),a=muCand(s)[i];if(!a)return;s.link=a.d+'|'+a.k.toFixed(2);s.done=true;s.skipped=false;s.rest=false;s.actual=Math.round(a.k*10)/10;save();r()}
function musheet(){if(!mud)return'';const m=MU(),s=m.plan.find(x=>x.id==mud);if(!s)return'';const st=muSt(s),D=(t,x,o)=>`<details class="dd"${o?' open':''}><summary>${t}</summary><div>${x}</div></details>`;let h=`<h2 style="margin:0">${esc(s.type)}</h2><div class="mu">${muWk(s)} · <span class="tag">${st}</span></div>`;
 if(s.ks)h+=D('Oefeningen ('+s.sets+' sets)',MUEX.map(e=>`<b>${e[0]}</b>: ${e[1][0]}, ${e[1][1]}<br><span class="mu">${e[3]}</span>`).join('<br><br>'),1)+D('Waarom','Sterke kuiten, achillespezen en core beschermen je bij veel kilometers.',1);
 else{h+=`<div style="margin:8px 0"><b>${s.km} km</b> · ${muPace(s)} <span class="mu">(richtwaarde)</span></div>`+D('Trainingsdoel',s.why,1)+D('Opwarming',s.wu,1)+D('Hoofdgedeelte',s.main,1)+D('Cooling-down',s.cd)+D('Rustpauzes',s.rp)+D('Aandachtspunten','Pijn aan achillespezen, kuiten of onderrug: verminder of stop. Haal gemiste kilometers nooit in.');
  if(s.race=='u')h+=`<h3 style="margin-top:12px">Wedstrijdstrategie</h3>${muCycle(100)}`;
  if(s.alt){const a=muA(s),on=m.pick[s.id]=='alt',ck=ic('<path d="M5 12l5 5 9-10"/>',16);h+=`<h3 style="margin-top:14px">Uitvoering${s.rec?' (3/1 aanbevolen in deze fase)':''}</h3><div class="vp" role="radiogroup" aria-label="Uitvoering"><button class="vc${on?'':' sel'}" role="radio" aria-checked="${!on}" onclick="muAct('${s.id}','pick',0)"><span class="vk">${ck}</span><b>Standaardtraining</b><span class="mu">${s.km} km ${esc(s.type.toLowerCase())}</span></button><button class="vc alt${on?' sel':''}" role="radio" aria-checked="${on}" onclick="muAct('${s.id}','pick',1)"><span class="vk">${ck}</span><b>3/1-alternatief</b><span class="mu">${s.km} km – 3 km lopen / 1 km wandelen</span></button></div><div class="mu" style="margin-top:6px">Twee manieren om dezelfde training uit te voeren. Jij kiest.</div>${rwViz(s,a,true)}${muCycle(s.km)}`}}
 const cd=s.ks?[]:muCand(s);h+=`<div style="margin-top:12px">${s.done||s.skipped||s.rest?`<button class="b g" onclick="muAct('${s.id}','undo')">Registratie ongedaan maken</button>`:`<button class="b" onclick="muAct('${s.id}','done')">Gedaan</button><button class="b g" onclick="muAct('${s.id}','skip')">Overslaan</button><button class="b g" onclick="muAct('${s.id}','rest')">Hersteldag</button>`}${s.ks?'':`<button class="b g" onclick="muAct('${s.id}','km')">Afstand aanpassen</button>`}</div>${cd.map((a,i)=>`<button class="b g" onclick="muLink('${s.id}',${i})">Koppel: ${a.k.toFixed(1)} km op ${a.d.slice(8)}/${a.d.slice(5,7)} (${esc(a.n)})</button>`).join('')}${s.actual?`<div class="mu" style="margin-top:6px">Werkelijk: ${s.actual} km${s.link?' (gekoppeld aan geïmporteerde activiteit)':''}</div>`:''}<button class="b g" style="margin-top:10px" onclick="mud=null;r()">Sluiten</button>`;
 return `<div class="sheet" onclick="mud=null;r()"><div onclick="event.stopPropagation()">${h}</div></div>`}
NI.mu=ic('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',22);

const MW=['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'];
function muCfg(){return Object.assign({q:1,e:4,l:6,s:[2,5],base:45,long:20},MU().cfg||{})}
const muCfgTxt=()=>{const c=muCfg();return `${c.base} km per week · langste duurloop ${c.long} km · loopdagen ${MW[c.q]}, ${MW[c.e]} en ${MW[c.l]} · krachtmomenten ${MW[c.s[0]]} en ${MW[c.s[1]]}`};
function muRebuild(cfg){const m=MU(),old=m.plan,N=muGen(cfg),keep=old.filter(s=>s.date<today||s.done||s.skipped||s.rest||s.edited||s.link),kd=new Set(keep.map(s=>s.date+(s.ks?'k':'r')));let nw=0;m.seq=m.seq||0;
 const fresh=N.filter(s=>s.date>=today&&!kd.has(s.date+(s.ks?'k':'r'))).map(s=>{const o=old.find(x=>x.date==s.date&&x.type==s.type&&!keep.includes(x)),id='r'+(++m.seq);if(o&&m.pick[o.id])m.pick[id]=m.pick[o.id];nw++;return Object.assign(s,{id})});
 m.plan=keep.concat(fresh).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);m.cfg=cfg;Object.keys(m.pick).forEach(k=>{if(!m.plan.some(x=>x.id==k))delete m.pick[k]});save();return{kept:keep.length,fresh:nw}}
function muMsg(t){MU().msg=t;save();r()}
function muApply(){const g=id=>+$('#'+id).value,c={q:g('mi_q'),e:g('mi_e'),l:g('mi_l'),s:[g('mi_s1'),g('mi_s2')],base:Math.min(90,Math.max(25,g('mi_b')||45)),long:Math.min(35,Math.max(10,g('mi_g')||20))},R=[c.q,c.e,c.l];
 if(new Set(R).size<3)return muMsg('Kies drie verschillende loopdagen.');
 if(c.s[0]==c.s[1]||c.s.some(x=>R.includes(x)))return muMsg('Kies twee verschillende krachtdagen die niet op een loopdag vallen.');
 if(!confirm('Het schema wordt vanaf vandaag opnieuw opgebouwd. Het verleden en je afgewerkte, overgeslagen, aangepaste en gekoppelde trainingen blijven bewaard. Doorgaan?'))return;
 const x=muRebuild(c),hard=(c.q+1)%7==c.l||(c.l+1)%7==c.q;MU().msg=`Schema bijgewerkt vanaf vandaag: ${x.fresh} trainingen opnieuw gepland, ${x.kept} behouden.`+(hard?' Let op: je lange duurloop valt direct na of voor je tempodag. Plan bij voorkeur een rustdag ertussen.':'');save();r()}
function muDef(){[1,4,6,2,5,45,20].forEach((v,i)=>{$('#'+['mi_q','mi_e','mi_l','mi_s1','mi_s2','mi_b','mi_g'][i]).value=v})}
function muInst(){const c=muCfg(),O=(id,v)=>`<select id="${id}">${MW.map((x,i)=>`<option value="${i}"${i==v?' selected':''}>${x}</option>`).join('')}</select>`;
 return `<div class="mu" style="margin:6px 0 10px">Pas je loopdagen en startgegevens aan. Alleen het schema vanaf vandaag wordt opnieuw opgebouwd. Het verleden en je registraties blijven bewaard. De wedstrijddata (25 april en 18 juni) en de wedstrijdweken liggen vast.</div>
<div class="c"><h3>Loopdagen</h3><label>Kwaliteitsdag (tempo of marathontempo)</label>${O('mi_q',c.q)}<label>Rustige duurloop</label>${O('mi_e',c.e)}<label>Lange duurloop</label>${O('mi_l',c.l)}<h3 style="margin-top:12px">Krachtdagen</h3><div class="g2"><div><label>Eerste krachtmoment</label>${O('mi_s1',c.s[0])}</div><div><label>Tweede krachtmoment</label>${O('mi_s2',c.s[1])}</div></div></div>
<div class="c"><h3>Startgegevens</h3><div class="g2"><div><label>Km per week nu</label><input id="mi_b" type="number" min="25" max="90" value="${c.base}"></div><div><label>Langste duurloop (km)</label><input id="mi_g" type="number" min="10" max="35" value="${c.long}"></div></div><div class="mu">De opbouw schaalt mee, maar blijft geleidelijk. Een lange duurloop wordt nooit meer dan ongeveer de helft van je weekvolume.</div><button class="b" onclick="muApply()">Schema opnieuw opbouwen vanaf vandaag</button><button class="b g" onclick="muDef()">Standaardwaarden invullen</button>${MU().msg?`<div role="status" style="margin-top:8px"><b>${esc(MU().msg)}</b></div>`:''}</div>`}

/* ===== Schemakeuze: één actief schema tegelijk (Standaard of Marathon + Ultra) ===== */
const muActive=()=>!!(S.mu&&S.mu.on&&S.mu.act);
function setAct(v){MU().act=!!v;if(mut=='d')mut='k';save();r()}
function planSw(){if(!(S.mu&&S.mu.on))return'';const a=muActive();return `<div class="psw" role="radiogroup" aria-label="Actief schema"><button role="radio" aria-checked="${!a}" class="${a?'':'on'}" onclick="setAct(0)">Standaardschema</button><button role="radio" aria-checked="${a}" class="${a?'on':''}" onclick="setAct(1)">Marathon + Ultra</button></div><div class="mu" style="margin:-4px 0 12px">${a?'Actief schema: Marathon + Ultra Challenge. Je standaardschema staat op pauze, er is niets gewist.':'Actief schema: standaardschema. De Challenge is beschikbaar maar loopt niet mee.'}</div>`}
function vTab(){if(!muActive()){const o=vTab0(),sw=planSw(),re=/(<div class="hero">[\s\S]*?<\/h2><\/div><\/div>)/;return sw?(re.test(o)?o.replace(re,'$1'+sw):sw+o):o}
 const p=S.p||{};return `<div class="hero">${S.photo?`<img class="av" src="${S.photo}" alt="">`:`<div class="av">${I.user}</div>`}<div><div class="mu">BAFFE · ${new Date().toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long'})}</div><h2 style="margin:0">Hoi ${esc(p.name||'loper')}</h2></div></div>`+planSw()+muToday()+muDash()+wxCard()}
function muToday(){const t=MU().plan.filter(s=>s.date==today);return `<h2>Vandaag</h2>`+(t.length?t.map(s=>muCard(s,true)).join(''):'<div class="c mu-c"><div class="mu">Geen training gepland vandaag. Rust is ook training.</div></div>')}
function muKal(){const S5=[['k','Kalender'],['z','Zones'],['c','Kracht'],['v','Voeding'],['i','Instellen']];if(mut=='d')mut='k';return planSw()+`<div class="seg" style="flex-wrap:wrap">${S5.map(x=>`<button class="${mut==x[0]?'on':''}" style="font-size:11.5px;flex:1 0 30%" onclick="mut='${x[0]}';r()">${x[1]}</button>`).join('')}</div>`+(mut=='k'?muCal():mut=='z'?muZones():mut=='c'?muKr():mut=='i'?muInst():muVo())}
function kTab(){return muActive()?muKal():planSw()+kTab0()}
function aTab(){return (muActive()?'<div class="c mu"><b>Let op:</b> XP, badges en records tellen je standaardschema. De voortgang van je Challenge zie je op Home.</div>':'')+aTabX()}

function photo(el){const f=el.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);S.photo=c.toDataURL('image/jpeg',.8);save();r()};im.src=fr.result};fr.readAsDataURL(f)}
function sp2(l,s){const o=[];let c='',q=0;for(const ch of l){if(ch=='"')q=!q;else if(ch==s&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o}
function hav(a,b,c,d){const R=6371,t=x=>x*Math.PI/180,u=t(c-a),v=t(d-b),h=Math.sin(u/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(v/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

 if(!S.p)tab='p';
 $('#v').innerHTML=(tab=='v'?vTab():tab=='k'?kTab():tab=='s'?sTab():tab=='a'?aTab():tab=='mu'?muTab():pTab())+(wp?wpSheet():sheet()+dsheet()+evsheet()+ksheet()+exsheet()+musheet())+toast();
 $('#nv').innerHTML=[['v','🏠','Vandaag'],['k','','Schema'],['s','😴','Slaap'],['a','','Prestaties'],['p','','Profiel']].map(x=>'<button class="'+(tab==x[0]?'on':'')+'" onclick="tab=\''+x[0]+'\';r()">'+NI[x[0]]+x[2]+'</button>').join('')}
if(S.last!=today){S.last=today;S.inbox.push({d:today,t:pick(TEASE)});S.inbox=S.inbox.slice(-20);save()}ap();ax();setTimeout(()=>{if(S.loc&&navigator.onLine&&(!S.wx||Date.now()-S.wx.t>18e5))wx()},600);
r();
